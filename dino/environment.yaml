name: dino_env
channels:
  - conda-forge
  - defaults
  - nvidia
  - pytorch
  - anaconda
dependencies:
  - python=3.10
  - pytorch>=2.3.1
  - torchvision
  - pytorch-cuda=12.4
  - cuda-toolkit=12.4.0
  - numpy>=1.24.4
  - tqdm>=4.66.1
  - hydra-core>=1.3.2
  - iopath>=0.1.10
  - pillow>=9.4.0
    # Notebooks dependencies
  - matplotlib>=3.9.1
  - jupyter>=1.0.0
  - opencv>=4.7.0
  # Interactive demo dependencies
  - flask>=3.0.3
  - flask-cors>=5.0.0
  - av>=13.0.0
  - gunicorn>=23.0.0
  - imagesize>=1.4.1
  - pycocotools>=2.0.8
  - strawberry-graphql>=0.239.2
  # Dev dependencies
  - black=24.2.0
  - pandas>=2.2.2
  - scikit-image>=0.24.0
